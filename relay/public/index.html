<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ST Sync 中转后台</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --panel-2: #23272f;
    --line: #2f343d;
    --text: #e6e9ee;
    --dim: #98a0ad;
    --accent: #5b9dff;
    --ok: #4ec9a0;
    --warn: #e0b341;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  button {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  input {
    font: inherit;
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 10px;
  }
  input:focus { outline: none; border-color: var(--accent); }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .auth { display: flex; gap: 8px; margin-left: auto; }
  header .auth input { width: 260px; }

  .notice {
    padding: 8px 20px;
    font-size: 13px;
    border-bottom: 1px solid var(--line);
  }
  .notice.ok { background: #14332a; color: var(--ok); }
  .notice.warn { background: #352d14; color: var(--warn); }
  .notice.err { background: #361b1b; color: var(--err); }

  main { display: flex; align-items: flex-start; min-height: calc(100vh - 110px); }

  aside {
    width: 260px;
    flex: none;
    border-right: 1px solid var(--line);
    min-height: 100%;
    padding-bottom: 20px;
  }
  .aside-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    color: var(--dim);
    font-size: 12px;
    letter-spacing: .04em;
  }
  #ns-list { list-style: none; margin: 0; padding: 0; }
  #ns-list li {
    padding: 9px 16px;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  #ns-list li:hover { background: var(--panel); }
  #ns-list li.active { background: var(--panel); border-left-color: var(--accent); }
  #ns-list .ns-name { font-weight: 600; }
  #ns-list .ns-time { color: var(--dim); font-size: 12px; }
  #ns-list .empty { color: var(--dim); cursor: default; }

  section { flex: 1; min-width: 0; padding: 16px 20px 40px; }
  .crumb {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    color: var(--dim);
    margin-bottom: 14px;
  }
  .crumb .sep { color: var(--line); }
  .crumb b { color: var(--text); }
  .crumb .spacer { flex: 1; }
  .crumb button { padding: 3px 10px; font-size: 12px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
    cursor: pointer;
  }
  .card:hover { border-color: var(--accent); }
  .card .name { font-weight: 600; font-size: 15px; margin-bottom: 8px; }
  .card dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
  .card dt { color: var(--dim); }
  .card dd { margin: 0; text-align: right; }
  .card .mono { font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: var(--panel); }
  td.key { cursor: pointer; word-break: break-all; }
  td.key:hover { color: var(--accent); }
  .tag {
    display: inline-block;
    margin-left: 6px;
    padding: 0 6px;
    border-radius: 4px;
    font-size: 11px;
    background: var(--panel-2);
    color: var(--dim);
    border: 1px solid var(--line);
  }

  .hint { color: var(--dim); font-size: 13px; }
  .hint code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }

  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .6);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal[hidden] { display: none; }
  .modal-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    width: min(900px, 100%);
    max-height: 85vh;
    display: flex;
    flex-direction: column;
  }
  .modal-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
  }
  .modal-head span { font-weight: 600; word-break: break-all; }
  .modal-head button { margin-left: auto; flex: none; }
  #modal-body {
    margin: 0;
    padding: 16px;
    overflow: auto;
    font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>ST Sync 中转后台</h1>
    <div class="sub">只读浏览 · 需要 ADMIN_TOKEN</div>
  </div>
  <div class="auth">
    <input id="token" type="password" placeholder="ADMIN_TOKEN" autocomplete="off" />
    <button id="connect">连接</button>
    <button id="forget" title="清除本机保存的令牌">忘记令牌</button>
  </div>
</header>

<div id="notice" class="notice" hidden></div>

<main>
  <aside>
    <div class="aside-head">
      <span>命名空间</span>
      <button id="refresh-ns" disabled>刷新</button>
    </div>
    <ul id="ns-list"></ul>
  </aside>
  <section>
    <div class="crumb" id="crumb"><span class="hint">先连接，再选一个命名空间</span></div>
    <div id="panels"></div>
  </section>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-head">
      <span id="modal-title"></span>
      <button id="modal-close">关闭</button>
    </div>
    <pre id="modal-body"></pre>
  </div>
</div>

<script>
'use strict';

const TOKEN_KEY = 'st-sync-relay-admin-token';
const JSON_PREVIEW_LIMIT = 200 * 1024;   // 超过这个大小就别往弹层里塞了

const state = { token: '', namespaces: [], ns: null, bucket: null };

const $ = (sel) => document.querySelector(sel);

/* ------------------------------------------------------------ 小工具 */

function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
}

function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
}

function humanSize(bytes) {
    if (!Number.isFinite(bytes)) return '—';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + ' MB';
    return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
}

function fmtTime(ms) {
    if (!Number.isFinite(ms)) return '—';
    const d = new Date(ms);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ` +
           `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

const enc = (v) => encodeURIComponent(v);
/** 逐段编码：整段编码会把 "/" 编掉，服务端就认不出分层路径了 */
const encKey = (key) => String(key).split('/').map(encodeURIComponent).join('/');

function notice(message, kind) {
    const box = $('#notice');
    if (!message) {
        box.hidden = true;
        return;
    }
    box.className = 'notice ' + (kind || '');
    box.textContent = message;
    box.hidden = false;
}

/* ------------------------------------------------------------ 接口调用 */

async function api(path) {
    let res;
    try {
        res = await fetch(path, { headers: { Authorization: `Bearer ${state.token}` } });
    } catch (err) {
        throw new Error(`连不上中转服务：${err.message}`);
    }
    const text = await res.text();
    let body = {};
    try {
        body = text ? JSON.parse(text) : {};
    } catch {
        body = { error: text.slice(0, 200) };
    }
    if (!res.ok) {
        const err = new Error(body.error || `HTTP ${res.status}`);
        err.status = res.status;
        throw err;
    }
    return body;
}

function reportError(err) {
    if (err.status === 401) {
        notice('缺少或格式不对的令牌。请填 ADMIN_TOKEN 后重新连接。', 'err');
    } else if (err.status === 403) {
        notice('令牌无效。请确认填的是 ADMIN_TOKEN（命名空间令牌不行）。', 'err');
    } else if (err.status === 500 && /ADMIN_TOKEN/.test(err.message)) {
        notice('服务端没有配置 ADMIN_TOKEN，管理接口不可用。请在部署环境里设置后重启。', 'err');
    } else {
        notice(err.message, 'err');
    }
}

/* ------------------------------------------------------------ 命名空间 */

async function loadNamespaces() {
    const data = await api('/admin/namespaces');
    state.namespaces = data.namespaces || [];
    renderNamespaces();
}

function renderNamespaces() {
    const list = $('#ns-list');
    clear(list);

    if (!state.namespaces.length) {
        list.appendChild(el('li', 'empty', '还没有任何命名空间'));
        return;
    }

    for (const item of state.namespaces) {
        const li = el('li');
        if (item.namespace === state.ns) li.classList.add('active');
        li.appendChild(el('div', 'ns-name', item.namespace));
        li.appendChild(el('div', 'ns-time', '建于 ' + fmtTime(Date.parse(item.createdAt))));
        li.addEventListener('click', () => selectNs(item.namespace));
        list.appendChild(li);
    }
}

/* ------------------------------------------------------------ 桶 */

async function selectNs(ns) {
    state.ns = ns;
    state.bucket = null;
    renderNamespaces();
    renderCrumb();
    await reloadBuckets();
}

async function reloadBuckets() {
    const panels = $('#panels');
    clear(panels);
    panels.appendChild(el('div', 'hint', '正在读取…'));
    try {
        const data = await api(`/admin/namespaces/${enc(state.ns)}/buckets`);
        renderBuckets(data.buckets || []);
        notice('');
    } catch (err) {
        clear(panels);
        reportError(err);
    }
}

function renderBuckets(buckets) {
    const panels = $('#panels');
    clear(panels);

    if (!buckets.length) {
        panels.appendChild(el('div', 'hint', '这个命名空间下还没有任何桶（还没有设备上传过）。'));
        return;
    }

    const cards = el('div', 'cards');
    for (const b of buckets) {
        const card = el('div', 'card');
        card.appendChild(el('div', 'name', b.bucket));

        const dl = el('dl');
        const rows = [
            ['文件数', String(b.count)],
            ['总大小', humanSize(b.usage)],
            ['新增时间', fmtTime(b.createdAt)],
            ['最近修改', fmtTime(b.lastModified)],
        ];
        for (const [label, value] of rows) {
            dl.appendChild(el('dt', null, label));
            dl.appendChild(el('dd', 'mono', value));
        }
        card.appendChild(dl);

        card.addEventListener('click', () => selectBucket(b.bucket));
        cards.appendChild(card);
    }
    panels.appendChild(cards);
}

/* ------------------------------------------------------------ 文件 */

async function selectBucket(bucket) {
    state.bucket = bucket;
    renderCrumb();
    await reloadFiles();
}

async function reloadFiles() {
    const panels = $('#panels');
    clear(panels);
    panels.appendChild(el('div', 'hint', '正在读取…'));
    try {
        const data = await api(
            `/admin/namespaces/${enc(state.ns)}/buckets/${enc(state.bucket)}`,
        );
        renderFiles(data.files || [], data.usage || 0);
        notice('');
    } catch (err) {
        clear(panels);
        reportError(err);
    }
}

function renderFiles(files, usage) {
    const panels = $('#panels');
    clear(panels);

    if (!files.length) {
        panels.appendChild(el('div', 'hint', '这个桶是空的。'));
        return;
    }

    const stats = el('div', 'hint');
    stats.textContent = `共 ${files.length} 个文件，合计 ${humanSize(usage)}。`;
    panels.appendChild(stats);

    const table = el('table');
    const thead = el('thead');
    const headRow = el('tr');
    for (const label of ['路径', '大小', '修改时间', '']) {
        headRow.appendChild(el('th', null, label));
    }
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = el('tbody');
    for (const file of files) {
        const tr = el('tr');

        const keyCell = el('td', 'key', file.key);
        const isJson = /\.json$/i.test(file.key);
        if (isJson && file.size <= JSON_PREVIEW_LIMIT) {
            keyCell.appendChild(el('span', 'tag', '可预览'));
        }
        keyCell.addEventListener('click', () => openFile(file));
        tr.appendChild(keyCell);

        tr.appendChild(el('td', 'num', humanSize(file.size)));
        tr.appendChild(el('td', 'num', fmtTime(file.mtime)));

        const actionCell = el('td', 'num');
        const btn = el('button', null, '下载');
        btn.addEventListener('click', (event) => {
            event.stopPropagation();
            download(file).catch(reportError);
        });
        actionCell.appendChild(btn);
        tr.appendChild(actionCell);

        tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    panels.appendChild(table);
}

const fileUrlOf = (file) =>
    `/admin/namespaces/${enc(state.ns)}/buckets/${enc(state.bucket)}/files/${encKey(file.key)}`;

/** JSON 且不太大就地展开；其余直接下载 */
async function openFile(file) {
    const isJson = /\.json$/i.test(file.key);
    if (!isJson || file.size > JSON_PREVIEW_LIMIT) {
        await download(file);
        return;
    }
    try {
        const res = await fetch(fileUrlOf(file), {
            headers: { Authorization: `Bearer ${state.token}` },
        });
        const text = await res.text();
        if (!res.ok) throw new Error(`HTTP ${res.status}：${text.slice(0, 200)}`);
        let pretty = text;
        try {
            pretty = JSON.stringify(JSON.parse(text), null, 2);
        } catch {
            // 不是合法 JSON 就原样展示，别把内容吞掉
        }
        showModal(file.key, pretty);
    } catch (err) {
        reportError(err);
    }
}

/**
 * 带 Authorization 头下载，所以不能用一个裸的 <a href> —— 那样请求不会带令牌。
 * 只能先 fetch 成 blob，再造一个临时链接把它交给浏览器。
 */
async function download(file) {
    const res = await fetch(fileUrlOf(file), {
        headers: { Authorization: `Bearer ${state.token}` },
    });
    if (!res.ok) {
        const text = await res.text();
        throw new Error(`下载失败 HTTP ${res.status}：${text.slice(0, 200)}`);
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = String(file.key).split('/').pop() || 'download';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
}

/* ------------------------------------------------------------ 面包屑与弹层 */

function renderCrumb() {
    const crumb = $('#crumb');
    clear(crumb);

    if (!state.ns) {
        crumb.appendChild(el('span', 'hint', '先连接，再选一个命名空间'));
        return;
    }

    const nsLink = el('span');
    nsLink.style.cursor = 'pointer';
    nsLink.textContent = state.ns;
    nsLink.addEventListener('click', () => selectNs(state.ns));
    crumb.appendChild(nsLink);

    if (state.bucket) {
        crumb.appendChild(el('span', 'sep', '/'));
        crumb.appendChild(el('b', null, state.bucket));
    }

    crumb.appendChild(el('span', 'spacer'));

    if (state.bucket) {
        const back = el('button', null, '← 返回桶列表');
        back.addEventListener('click', () => {
            state.bucket = null;
            renderCrumb();
            reloadBuckets();
        });
        crumb.appendChild(back);

        const refresh = el('button', null, '刷新');
        refresh.addEventListener('click', () => reloadFiles());
        crumb.appendChild(refresh);
    } else {
        const refresh = el('button', null, '刷新');
        refresh.addEventListener('click', () => reloadBuckets());
        crumb.appendChild(refresh);
    }
}

function showModal(title, body) {
    $('#modal-title').textContent = title;
    $('#modal-body').textContent = body;
    $('#modal').hidden = false;
}

function hideModal() {
    $('#modal').hidden = true;
    $('#modal-body').textContent = '';
}

/* ------------------------------------------------------------ 连接 */

async function connect() {
    const token = $('#token').value.trim();
    if (!token) {
        notice('请先填 ADMIN_TOKEN。', 'warn');
        return;
    }
    state.token = token;
    $('#connect').disabled = true;
    try {
        await loadNamespaces();
        localStorage.setItem(TOKEN_KEY, token);
        $('#refresh-ns').disabled = false;
        notice(`连接成功，共 ${state.namespaces.length} 个命名空间。`, 'ok');
        // 之前选中过的命名空间如果还在，就自动选回去
        if (state.ns && state.namespaces.some((n) => n.namespace === state.ns)) {
            await selectNs(state.ns);
        }
    } catch (err) {
        state.token = '';
        state.namespaces = [];
        renderNamespaces();
        reportError(err);
    } finally {
        $('#connect').disabled = false;
    }
}

function forgetToken() {
    localStorage.removeItem(TOKEN_KEY);
    $('#token').value = '';
    state.token = '';
    state.ns = null;
    state.bucket = null;
    state.namespaces = [];
    $('#refresh-ns').disabled = true;
    renderNamespaces();
    renderCrumb();
    clear($('#panels'));
    notice('已清除本机保存的令牌。', 'warn');
}

/* ------------------------------------------------------------ 启动 */

$('#connect').addEventListener('click', connect);
$('#forget').addEventListener('click', forgetToken);
$('#token').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') connect();
});
$('#refresh-ns').addEventListener('click', () => loadNamespaces().catch(reportError));
$('#modal-close').addEventListener('click', hideModal);
$('#modal').addEventListener('click', (event) => {
    if (event.target === $('#modal')) hideModal();
});
document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') hideModal();
});

renderCrumb();
renderNamespaces();

const saved = localStorage.getItem(TOKEN_KEY);
if (saved) {
    $('#token').value = saved;
    connect();
} else {
    notice('填 ADMIN_TOKEN 后点「连接」。令牌只存在这台浏览器里，不会发给除本服务之外的地方。', '');
}
</script>
</body>
</html>
